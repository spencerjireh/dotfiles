# shellcheck shell=bash disable=SC2034
# work: minimal setup for a locked-down work machine (WSL + Homebrew).
# Nothing here installs an app, pipes an installer from curl, or needs admin
# rights: packages come from brew, plugins are plain git clones. sudo is only
# used after an explicit yes. Claude tooling is left out; the agent is Kiro.
PROFILE_DESC="Minimal work setup for WSL: brew and git clones only, no apps, no admin"

PROFILE_COMPONENTS="Homebrew CLI packages,Neovim config,tmux + TPM,Zsh + Oh My Zsh,Git global config"
PROFILE_EXCLUDE="Ghostty terminal,Claude Code,Nerd Font,GitHub SSH + CLI,Karabiner (Caps Lock as Esc/Ctrl),macOS defaults"

PROFILE_BREWFILE="Brewfile.work"
PROFILE_SUDO="ask"
PROFILE_BOOTSTRAP_BREW=0
PROFILE_LOGIN_SHELL="bashrc"
PROFILE_GIT_SIGNING=0
PROFILE_READONLY=1
PROFILE_ASK_GLYPHS=1

# DOTFILES_MASON=0        Neovim uses language servers found on PATH (brew); no Mason downloads, no debug adapters
# DOTFILES_AGENT=kiro     no Claude plugin or keys in Neovim
# DOTFILES_TMUX_THUMBS=0  tmux-thumbs needs a Rust build; skipped
# DOTFILES_PREBUILT=0     plugins fetch no prebuilt binaries: powerlevel10k uses vcs_info
#                         instead of gitstatusd, blink.cmp uses its Lua matcher
PROFILE_SETTINGS="DOTFILES_MASON=0 DOTFILES_AGENT=kiro DOTFILES_TMUX_THUMBS=0 DOTFILES_PREBUILT=0"
