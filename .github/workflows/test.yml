name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and tmux
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux

      - name: Install stylua
        run: |
          curl -fsSL -o /tmp/stylua.zip \
            https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          sudo unzip -o -q /tmp/stylua.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/stylua

      - name: Run test suite
        run: ./tests/run.sh

  # Runs install.sh non-interactively for the config components on each
  # supported OS, then checks what it produced. Brew-backed components are
  # left out so the job stays fast and Linux never bootstraps Linuxbrew.
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            components: "Neovim config,tmux + TPM,Zsh + Oh My Zsh,Git global config,Superfile file manager"
          - os: ubuntu-latest
            components: "Neovim config,tmux + TPM,Zsh + Oh My Zsh,Git global config"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install neovim tmux tree-sitter-cli

      - name: Prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y tmux zsh
          # apt's neovim is too old for this config; use the release tarball
          curl -fsSL -o /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
          sudo tar -xzf /tmp/nvim.tar.gz -C /opt
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          sudo npm install -g tree-sitter-cli
          nvim --version | head -1

      - name: Run the installer non-interactively (config components only)
        env:
          DOTFILES_NONINTERACTIVE: "1"
          DOTFILES_COMPONENTS: ${{ matrix.components }}
          GIT_NAME: ci
          GIT_EMAIL: ci@example.com
        run: ./install.sh

      - name: Check the symlinks and plugin dirs the installer created
        run: ./bin/dot doctor --links

      - name: Restore Neovim plugins and compile parsers headlessly
        run: |
          NVIM_TS_SYNC=1 nvim --headless "+Lazy! restore" +qa
          nvim --headless +'lua local n=#require("lazy").plugins(); assert(n > 40, "only "..n.." plugins"); local p=require("nvim-treesitter").get_installed("parsers"); assert(#p >= 20, "only "..#p.." parsers"); io.write("plugins=",n," parsers=",#p,"\n")' +qa

      - name: tmux plugins installed headlessly
        run: test "$(ls ~/.tmux/plugins | wc -l | tr -d ' ')" = 3

      - name: dot command works through its PATH symlink
        run: |
          ~/.local/bin/dot help
          ~/.local/bin/dot keys tmux | head -3
          test -f ~/.config/dotfiles/components && cat ~/.config/dotfiles/components
