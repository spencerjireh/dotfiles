# tmux Configuration - Vesper Theme
# Ghostty as renderer, tmux as window manager

# ===========================
# Prefix Key
# ===========================
# Ghostty translates cmd+shift+space to ctrl+space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ===========================
# General Settings
# ===========================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:RGB"  # xterm-ghostty outside, tmux-256color inside

# Allow cursor shape passthrough for vim mode
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Undercurl support for neovim diagnostics
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow passthrough for image.nvim
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on

# ===========================
# Vi Mode
# ===========================
setw -g mode-keys vi
set -g status-keys vi

# ===========================
# Copy Mode (vim-style)
# ===========================
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
# Clipboard command, chosen once per platform; used by every copy binding below
if-shell "uname | grep -q Darwin" \
    "set -g @clip 'pbcopy'" \
    "set -g @clip 'xclip -selection clipboard'"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "#{@clip}"
bind -T copy-mode-vi Escape send -X cancel

# Word motions
bind -T copy-mode-vi w send -X next-word
bind -T copy-mode-vi b send -X previous-word
bind -T copy-mode-vi e send -X next-word-end

# Line navigation
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi 0 send -X start-of-line
bind -T copy-mode-vi '$' send -X end-of-line

# Buffer navigation
bind -T copy-mode-vi g send -X history-top
bind -T copy-mode-vi G send -X history-bottom

# Swap cursor position in selection (like o in vim visual)
bind -T copy-mode-vi o send -X other-end

# ===========================
# Panes: C-h/j/k/l (no prefix) is a direction
# ===========================
# With the prefix, h/j/k/l act on windows instead (see Windows below).
# Neovim: <Space>h/j/k/l and C-h/j/k/l (docs/tmux.md "Mental model").

# Seamless vim-tmux navigation (no prefix, works with vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ===========================
# Pane Splitting
# ===========================
# | and - only (Neovim uses <Space>| and <Space>- for the same thing)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind v
unbind s

# ===========================
# Pane Resizing
# ===========================
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===========================
# Windows: h/l move the window left/right, j/k next/previous, c new, X kill
# ===========================
# Ghostty sends the same keys for Cmd+Shift+H/J/K/L.
bind -r h swap-window -t -1 \; select-window -t -1
bind -r l swap-window -t +1 \; select-window -t +1
bind -r j next-window
bind -r k previous-window
bind -r p previous-window   # tmux default, kept
bind -r n next-window       # tmux default, kept
unbind <
unbind >
bind c new-window -a -c "#{pane_current_path}"

# Quick window access (Alt+number, no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ===========================
# Session Management
# ===========================
bind S command-prompt -p "New session:" "new-session -s '%%'"
# F: session switcher (f is the window switcher below; "f" = find in both layers)
unbind w
bind F display-popup -E -w 40% -h 50% 'cur=$(tmux display-message -p "#S"); tmux list-sessions -F "#{session_name}" | fzf --reverse --header="@ $cur | C-x: kill" --bind "ctrl-x:execute-silent(tmux kill-session -t {})+reload(tmux list-sessions -F \"#{session_name}\")" | xargs tmux switch-client -t'
# o: open a project directory (~/Projects, or DOTFILES_PROJECT_DIRS) as a session; creates or switches.
# Runs the zsh function fproj from zsh/50-functions.zsh alone, so the popup skips Oh My Zsh startup.
bind o display-popup -E -w 50% -h 60% 'zsh -c "source \"$($HOME/.local/bin/dot dir)/zsh/50-functions.zsh\" && fproj"'

# ===========================
# Capture Last Command Output
# ===========================
# Copies the last command + its output to the system clipboard
# Works by finding text between the last two transient prompt markers (❯)
# sed '1!G;h;$p' reverses lines portably (tail -r is macOS-only, tac is GNU-only)
bind y run-shell 'tmux capture-pane -p -S - -J | sed -n "1!G;h;\$p" | awk "/❯/{n++; if(n==2){print; exit} next} n==1" | sed -n "1!G;h;\$p" | #{@clip} && tmux display "Output copied"'

# ===========================
# Quick Actions
# ===========================
bind r source-file ~/.tmux.conf \; display "Config reloaded"
bind C-l send-keys C-l   # clear screen (C-l without prefix is pane navigation)
# q closes the smallest thing, Q the biggest (Neovim: <Space>q window, <Space>Q all)
unbind x
bind q kill-pane
bind X kill-window
bind Q confirm-before -p "Kill session? (y/n)" kill-session

# ===========================
# Popups and Switchers
# ===========================
# Floating scratch terminal
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Cross-session window switcher (fzf); f = find, like <Space>f in Neovim
unbind /
bind f display-popup -E -w 40% -h 50% 'tmux list-windows -a -F "#{session_name}:#{window_index}: #{window_name}" | fzf --reverse --header="Switch window" | cut -d: -f1,2 | xargs tmux switch-client -t'

# ===========================
# Help / Keybinding Reference
# ===========================
# Keybinding reference: docs/tmux.md via `dot keys tmux` (absolute path: popups run without ~/.local/bin on PATH)
bind ? display-popup -w 80% -h 90% -E "$HOME/.local/bin/dot keys tmux || { echo 'dot is not installed; run ./install.sh'; sleep 2; }"

# ===========================
# Vesper Theme - Status Bar
# ===========================
set -g status off
set -g status-position top
set -g status-justify centre
set -g status-style "bg=#101010,fg=#a0a0a0"

# Left / right: kept minimal, the bar is off by default (prefix + b toggles it)
set -g status-left-length 20
set -g status-left ""
set -g status-right-length 40
set -g status-right "#[fg=#505050]#S "

# Auto-rename windows: directory when idle, directory:command when active
set -g automatic-rename on
set -g automatic-rename-format "#{=/8:#{b:pane_current_path}}#{?#{==:#{pane_current_command},zsh},,[#{=/8:#{pane_current_command}}]}"

# Window tabs - dots as indicators
setw -g window-status-format "#[fg=#505050] ○ #W "
setw -g window-status-current-format "#[fg=#ffc799] ● #W "
setw -g window-status-separator ""

# Toggle status bar with prefix + b
bind b set -g status

# ===========================
# Pane Borders - Vesper
# ===========================
set -g pane-border-style "fg=#2a2a2a"
set -g pane-active-border-style "fg=#ffc799"

# ===========================
# Message Style
# ===========================
set -g message-style "bg=#ffc799,fg=#101010,bold"
set -g message-command-style "bg=#101010,fg=#ffc799"

# ===========================
# Copy Mode Highlight
# ===========================
setw -g mode-style "bg=#2a2a2a,fg=#ffffff"

# ===========================
# Plugins (TPM)
# ===========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'fcsonline/tmux-thumbs'

# Session persistence: tmux-resurrect + hooks (replaces tmux-continuum, whose
# save timer lives in the status line and never fires with `status off`).
# prefix+C-s / prefix+C-r still save / restore manually.
set -g @resurrect-capture-pane-contents 'on'

# Save on every structural change. Guards: skip the installer's throwaway
# server (DOTFILES_TMUX_BOOTSTRAP is inherited from whoever started tmux),
# skip if resurrect is not installed yet, never save an empty server.
%hidden resurrect_save='[ -z "$DOTFILES_TMUX_BOOTSTRAP" ] && [ -x ~/.tmux/plugins/tmux-resurrect/scripts/save.sh ] && tmux list-sessions >/dev/null 2>&1 && ~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet'
set-hook -g client-detached "run-shell -b '$resurrect_save'"
set-hook -g session-closed  "run-shell -b '$resurrect_save'"
set-hook -g window-linked   "run-shell -b '$resurrect_save'"
set-hook -g window-unlinked "run-shell -b '$resurrect_save'"
set-hook -g pane-exited     "run-shell -b '$resurrect_save'"

# tmux-thumbs (Vesper colors)
set -g @thumbs-key t
set -g @thumbs-fg-color '#101010'
set -g @thumbs-bg-color '#ffc799'
set -g @thumbs-hint-fg-color '#101010'
set -g @thumbs-hint-bg-color '#80d9c7'
set -g @thumbs-select-fg-color '#101010'
set -g @thumbs-select-bg-color '#ff8080'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# Auto-restore the last save once per server start (replaces @continuum-restore).
# The guard is a server-scoped option, so prefix+r / source-file will not restore twice.
%hidden resurrect_restore='[ -z "$DOTFILES_TMUX_BOOTSTRAP" ] && [ "$(tmux show-option -gqv @resurrect-auto-restored)" != 1 ] && tmux set-option -g @resurrect-auto-restored 1 && [ -x ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh ] && ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'
run-shell "$resurrect_restore"
